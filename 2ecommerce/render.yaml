services:
  - type: web
    name: pvc-blinds-storefront
    env: python
    rootDir: front_store
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pvc-blinds-db
          property: connectionString

  - type: web
    name: pvc-blinds-admin
    env: python
    rootDir: admin_dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pvc-blinds-db
          property: connectionString

databases:
  - name: pvc-blinds-db
    databaseName: pvc_blinds
    user: pvc_blinds_user
    plan: free
